name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'app/api/**'
              - '.github/workflows/ci.yml'
            worker:
              - 'app/worker/**'
              - '.github/workflows/ci.yml'
            shared:
              - 'config/**'
              - 'pyproject.toml'

  api:
    name: api
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        working-directory: app/api
        run: uv sync --extra dev

      - name: Lint and format check
        working-directory: app/api
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        working-directory: app/api
        run: uv run pytest

  worker:
    name: worker
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: app/worker
        run: npm ci

      - name: Lint and format check
        working-directory: app/worker
        run: |
          npm run lint
          npm run format:check

      - name: Run tests
        working-directory: app/worker
        run: npm test

  ci-passed:
    name: ci-passed
    needs: [changes, api, worker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job's result
        env:
          CHANGES: ${{ needs.changes.result }}
          API: ${{ needs.api.result }}
          WORKER: ${{ needs.worker.result }}
        run: |
          echo "changes=$CHANGES api=$API worker=$WORKER"
          if [ "$CHANGES" != success ]; then
            echo "::error::change detection did not succeed, so nothing was tested"
            exit 1
          fi
          for result in "$API" "$WORKER"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a service job ended in: $result"; exit 1 ;;
            esac
          done
