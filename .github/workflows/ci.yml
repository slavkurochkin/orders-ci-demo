name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'probe-reuse-**']
  workflow_dispatch:

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-service-ci.yml'
              - '.github/actions/setup-service/**'
            api:
              - *shared
              - 'app/api/**'
            worker:
              - *shared
              - 'app/worker/**'

  # A job that calls a reusable workflow has no runs-on and no steps.
  api:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service: api
      versions: '["3.11", "3.12", "3.13"]'
    steps:
      - run: echo "one more step"

  worker:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.worker == 'true'
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service: worker
      versions: '["22"]'

  ci-passed:
    name: ci-passed
    needs: [changes, api, worker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job's result
        env:
          CHANGES: ${{ needs.changes.result }}
          API: ${{ needs.api.result }}
          WORKER: ${{ needs.worker.result }}
          API_VERSIONS: ${{ needs.api.outputs.tested-versions }}
        run: |
          echo "changes=$CHANGES api=$API worker=$WORKER api-versions=$API_VERSIONS"
          if [ "$CHANGES" != success ]; then
            echo "::error::change detection did not succeed, so nothing was tested"
            exit 1
          fi
          for result in "$API" "$WORKER"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a service job ended in: $result"; exit 1 ;;
            esac
          done
