# Probe: a matrixed job writes matrix.version into a job output. Who wins?
name: Last writer probe

on:
  push:
    branches: ['probe-reuse-lastwriter']

jobs:
  write:
    name: write (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - version: "3.11"
            delay: 0
          - version: "3.12"
            delay: 10
          - version: "3.13"
            delay: 20
    outputs:
      version: ${{ steps.w.outputs.version }}
    steps:
      - id: w
        run: |
          sleep ${{ matrix.delay }}
          echo "version=${{ matrix.version }}" >> "$GITHUB_OUTPUT"
          echo "leg ${{ matrix.version }} wrote its output at $(date -u +%H:%M:%S.%N)"

  read:
    needs: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "needs.write.outputs.version = ${{ needs.write.outputs.version }}"
