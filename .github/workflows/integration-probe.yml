# Probe (probe-svc-* only): how long does DynamoDB Local take to answer on a
# GitHub-hosted runner? The first step polls immediately, before checkout.
name: Integration probe

on:
  push:
    branches: ['probe-svc-**']
  workflow_dispatch:

jobs:
  startup:
    name: startup (leg ${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4, 5]
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports:
          - 8000:8000
    steps:
      - name: Time to first answer
        env:
          CID: ${{ job.services.dynamodb.id }}
        run: |
          first_poll=$(date -u +%s.%N)
          n=0
          until code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000) && [ "$code" != "000" ]; do
            n=$((n+1)); sleep 0.05
          done
          answered=$(date -u +%s.%N)
          started=$(date -u -d "$(docker inspect -f '{{.State.StartedAt}}' "$CID")" +%s.%N)
          echo "first poll: $(echo "$first_poll - $started" | bc)s after container start"
          echo "first answer (HTTP $code): $(echo "$answered - $started" | bc)s after container start, after $n refused polls"
          docker logs "$CID" 2>&1 | head -3
