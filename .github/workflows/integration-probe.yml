# Probe workflow (probe-svc-* branches only): integration tests against
# DynamoDB Local as a GitHub Actions service container.
name: Integration probe

on:
  push:
    branches: ['probe-svc-**']
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (FakeStore)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: app/api
        run: make install
      - name: Run unit tests
        working-directory: app/api
        run: make test

  integration:
    name: integration (dynamodb-local:${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tag: ["3.3.2"]

    services:
      dynamodb:
        image: amazon/dynamodb-local:${{ matrix.tag }}
        # ports: removed for the probe

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: app/api
        run: make install

      # GET / answers HTTP 400 (MissingAuthenticationToken) even when DynamoDB
      # Local is up, so `curl -f` would never succeed. Any HTTP answer = ready.
      - name: Wait for DynamoDB Local
        continue-on-error: true  # probe: also show what the tests say
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8000; then
              echo "ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          curl -sS -o /dev/null http://localhost:8000 || true
          echo "::error::DynamoDB Local never became reachable on localhost:8000"
          exit 1

      - name: Race margin (probe instrumentation)
        if: always()
        env:
          CID: ${{ job.services.dynamodb.id }}
        run: |
          echo "service container started: $(docker inspect -f '{{.State.StartedAt}}' "$CID")"
          echo "now (after wait): $(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          echo "image: $(docker inspect -f '{{.Config.Image}}' "$CID") arch: $(docker image inspect -f '{{.Architecture}}' "$(docker inspect -f '{{.Image}}' "$CID")")"
          echo "health: $(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no healthcheck{{end}}' "$CID")"
          for tool in curl wget bash sh; do
            if docker exec "$CID" "$tool" --version >/dev/null 2>&1; then echo "in image: $tool yes"; else echo "in image: $tool no"; fi
          done
          echo "HTTP GET / -> $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000 || true)"

      - name: Run integration tests
        working-directory: app/api
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_REGION: us-east-1
        run: uv run pytest -m integration -rA
